name: "Draftboard WASM"

on:
  workflow_dispatch: {}
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: draftboard-wasm
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WASM_BINDGEN_CLI_VERSION: "0.2.121"
      CARGO_ABOUT_VERSION: "0.9.2"
      BINARYEN_VERSION: "130"
      BINSTALL_DISABLE_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.98"
          target: wasm32-unknown-unknown
          cache: false
          rustflags: ""

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main

      - name: Install wasm-bindgen-cli, cargo-about, wasm-opt
        run: |
          cargo binstall --no-confirm --force "wasm-bindgen-cli@$WASM_BINDGEN_CLI_VERSION" "cargo-about@$CARGO_ABOUT_VERSION"
          mkdir -p "$HOME/.binaryen"
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" | tar xz -C "$HOME/.binaryen" --strip-components=1
          echo "$HOME/.binaryen/bin" >> "$GITHUB_PATH"

      - name: Build web
        env:
          NODE_ENV: production
        run: cargo run build web

      - name: Package
        run: |
          tar czf pkg.tar.gz -C frontend/wrapper/pkg .
          tar czf dist.tar.gz -C frontend/dist .
          ls -la pkg.tar.gz dist.tar.gz

      - name: Publish wasm-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete wasm-latest --cleanup-tag -y || true
          gh release create wasm-latest pkg.tar.gz dist.tar.gz --target "$GITHUB_SHA" --prerelease --title "Draftboard WASM (latest)" --notes "Prebuilt WASM + frontend dist from $GITHUB_SHA"
